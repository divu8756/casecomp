<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --paper:#F3F5F7; --grid:#DCE3EA; --ink:#18233A; --muted:#5D6B80;
  --surface:#FFFFFF; --line:#C9D3DD;
  --hl:#F2D94E; --hl-ink:#3A3000;
  --con:#1F6F78; --pm:#5B4BB7;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A26; --grid:#1C2635; --ink:#E6ECF3; --muted:#93A1B5;
    --surface:#18222F; --line:#2C3A4D; --hl:#E4C83A; --hl-ink:#1E1900;
    --con:#4FB3BD; --pm:#9C8FEA;
  }
}
:root[data-theme="dark"]{
  --paper:#121A26; --grid:#1C2635; --ink:#E6ECF3; --muted:#93A1B5;
  --surface:#18222F; --line:#2C3A4D; --hl:#E4C83A; --hl-ink:#1E1900;
  --con:#4FB3BD; --pm:#9C8FEA;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);border-bottom:2px solid var(--ink)}
.mark{font-family:var(--serif);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;white-space:nowrap}
.mark span{background:var(--hl);color:var(--hl-ink);padding:0 4px}
.track{display:flex;margin-left:auto;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.track button{border:0;background:transparent;padding:6px 12px;font-size:.85rem;font-weight:600}
.track button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.iconbtn{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:20px 16px 8px}
.empty{max-width:560px;margin:8vh auto 0;text-align:left}
.empty h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
.empty p{color:var(--muted);margin:0 0 20px;max-width:46ch}
.primary{border:0;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-weight:600}
.primary:disabled{opacity:.5;cursor:default}

.msg{margin:0 0 18px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;padding:12px 14px;border-radius:12px;overflow-wrap:anywhere}
.user .bubble{background:var(--ink);color:var(--paper);border-bottom-right-radius:3px;white-space:pre-wrap}
.coach .bubble{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--hl);border-bottom-left-radius:3px;font-family:var(--serif);line-height:1.6}
.coach .bubble h1,.coach .bubble h2,.coach .bubble h3{font-family:var(--sans);font-size:1rem;margin:14px 0 6px}
.coach .bubble p{margin:0 0 10px}
.coach .bubble p:last-child{margin-bottom:0}
.coach .bubble ul,.coach .bubble ol{margin:0 0 10px;padding-left:22px}
.coach .bubble strong{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--hl) 55%,transparent) 55%)}
.coach .bubble code{font-size:.9em;background:var(--paper);padding:1px 4px;border-radius:4px}
.coach .bubble pre{overflow-x:auto;background:var(--paper);padding:10px;border-radius:8px;font-size:.85rem}
.tablewrap{overflow-x:auto;margin:0 0 10px}
.coach .bubble table{border-collapse:collapse;font-family:var(--sans);font-size:.88rem}
.coach .bubble th,.coach .bubble td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.coach .bubble th{background:var(--paper)}
.thinking{color:var(--muted);font-family:var(--sans);font-style:italic}
.note{font-size:.85rem;color:var(--muted);margin:-8px 0 16px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500}
.chip:hover{border-color:var(--ink)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 16px 14px;background:var(--paper);border-top:1.5px solid var(--line)}
textarea{flex:1;resize:none;border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink);max-height:160px;min-height:46px}
.send{height:46px;min-width:68px}

.sheet{position:fixed;inset:0;display:none;z-index:10}
.sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,15,25,.45)}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--paper);border-left:2px solid var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1.5px solid var(--line)}
.panel-head h2{font-family:var(--serif);font-size:1.2rem;margin:0}
.progress{font-size:.85rem;color:var(--muted);margin-left:auto}
.panel-body{overflow-y:auto;padding:8px 16px 24px}
.group h3{font-size:.95rem;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.item button{flex:1;text-align:left;border:0;background:none;padding:2px 0}
.item button:hover{text-decoration:underline}
.item.done button{color:var(--muted)}
.unavailable{border:1.5px solid var(--ink);background:var(--surface);padding:14px;border-radius:10px;margin-bottom:16px}
@media (max-width:480px){.mark{font-size:1.05rem}.track button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark"><span>Case</span> Coach</div>
    <div class="track" role="group" aria-label="Interview track">
      <button data-track="both" aria-pressed="true">Both</button>
      <button data-track="consulting" aria-pressed="false">Consulting</button>
      <button data-track="product" aria-pressed="false">PM</button>
    </div>
    <button class="iconbtn" id="libBtn">Frameworks</button>
  </header>

  <main id="log" aria-live="polite"></main>

  <div class="chips" id="chips"></div>
  <div class="composer">
    <textarea id="box" rows="1" placeholder="Answer the coach, or ask anything"></textarea>
    <button class="primary send" id="sendBtn">Send</button>
  </div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-label="Frameworks">
    <div class="panel-head">
      <h2>Frameworks</h2>
      <span class="progress" id="progress"></span>
      <button class="iconbtn" id="closeLib">Close</button>
    </div>
    <div class="panel-body" id="libBody"></div>
  </div>
</div>

<script>
const LIB = [
  {name:"Core thinking", color:"var(--ink)", items:["MECE and issue trees","Hypothesis-driven problem solving","Pyramid Principle and synthesis","Clarifying questions","Case math: margins, break-even, CAGR, payback"]},
  {name:"Consulting", color:"var(--con)", items:["Profitability","Market sizing and guesstimates","Market entry","Growth strategy and Ansoff","M&A and partnerships","Pricing","New product launch and GTM","Operations and process","Porter's 5 Forces","3C and 4P","BCG matrix","PESTEL and SWOT","Unconventional cases"]},
  {name:"Product management", color:"var(--pm)", items:["Product design (CIRCLES)","Product improvement","Metrics and North Star","Metric drop root cause analysis","Prioritisation: RICE, MoSCoW, Kano","Product strategy","PM estimation questions","A/B testing and experimentation","Trade-offs and launch decisions","Behavioural: STAR and Amazon LPs","AI PM: evals, guardrails, agentic design"]},
  {name:"The bridge", color:"var(--hl)", items:["Consulting vs PM: how answers differ"]}
];

const RULES = `You are my case interview coach: an ex-MBB engagement manager who now hires Product Managers at a top tech company. You coach Socratically: make me attempt first, then correct, then show the model answer.

ABOUT ME: One-year Executive MBA (IPMX) student at IIM Lucknow preparing for campus placements. 5+ years in Telecom CRM and digital transformation at Infosys (Verizon, Proximus); Salesforce and Product Owner certified. Targets: management consulting (e.g. Accenture Strategy) and product management (PhonePe, Razorpay, Stripe, Amazon, Google), long-term focus on AI / agentic AI products. I've done national-level case competitions, so I know basic structuring but haven't studied frameworks systematically. Use telecom, CRM, fintech and AI examples, and Indian market numbers where relevant.

OBJECTIVE: Teach every framework I need for consulting and PM case interviews, when and how to apply each, how to adapt rather than recite, and drill me until I can crack a 25–30 minute live case.

HOW TO TEACH A FRAMEWORK, one step per message: (1) when to use it and the question patterns that trigger it; (2) the structure as a compact issue tree or step list; (3) generic vs tailored version side by side; (4) common mistakes interviewers notice; (5) a worked example with math; (6) a drill: give a short case, WAIT for my attempt, then score and correct; (7) a 5-line cheat sheet.

MOCK INTERVIEWS: When I ask for a mock, first ask the style: interviewer-led (McKinsey), candidate-led (BCG/Bain), Indian campus style (short, guesstimate-heavy), or big tech PM (Google/Amazon). Reveal data only when I ask or reach the right branch; use markdown tables as exhibits. Push back, change constraints, ask "so what?". No hints unless I ask or am clearly stuck.

FEEDBACK RUBRIC (1–5 each, one specific fix per item): Structure | Hypothesis-driven thinking | Business/user insight | Math accuracy and speed | Communication | Synthesis. End mocks with: verdict (would I pass this round?), top strength, the single most important fix, one follow-up drill.

RULES: One step at a time; never dump a whole module unless asked. Always let me attempt before showing answers. Penalise forcing a framework onto a case it doesn't fit. Label assumed numbers as assumptions. Keep each message under about 250 words unless giving a cheat sheet or model answer. Use markdown (short headings, lists, tables). When you need my input, end with one clear question. Track my weak areas across the conversation and revisit them.`;

const TRACK_NOTE = {
  both:"Current track: BOTH consulting and product management. Alternate between them and highlight how answers differ.",
  consulting:"Current track: CONSULTING only. Use consulting-style cases and interviewer behaviour.",
  product:"Current track: PRODUCT MANAGEMENT only. Use PM-style cases and big tech interviewer behaviour."
};

const CHIPS = [
  ["Start diagnostic","Run the diagnostic: 3 quick questions to gauge my level, then propose a study plan. Ask me for my placement timeline."],
  ["Mock consulting case","Run a mock consulting case interview."],
  ["Mock PM case","Run a mock product management interview."],
  ["Quick drill","Give me a quick 5-minute drill on one of my weakest areas so far (or a common one if you don't know yet)."],
  ["Guesstimate","Give me an India-focused guesstimate. Wait for my structure before revealing anything."],
  ["Score my answer","Score my last answer on the rubric and show the model answer."],
  ["Cheat sheet","Give me a cheat sheet of everything we've covered so far."],
  ["I'm stuck","I'm stuck. Give me one small hint, not the answer."]
];

let state = {turns:[], learned:[], track:"both"};
let sample = null, db = null, docRef = null, sampleDenied = false;
let busy = false, ctl = null;

const $ = s => document.querySelector(s);
const log = $("#log"), box = $("#box"), sendBtn = $("#sendBtn");

function md(text){
  try{
    if (window.marked && window.DOMPurify){
      const html = DOMPurify.sanitize(marked.parse(text));
      return html.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>');
    }
  }catch(e){}
  const d = document.createElement("div"); d.textContent = text; return d.innerHTML.replace(/\n/g,"<br>");
}

function bubble(role, text){
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "coach");
  const b = document.createElement("div"); b.className = "bubble";
  if (role === "user") b.textContent = text; else b.innerHTML = md(text);
  wrap.appendChild(b); log.appendChild(wrap);
  return b;
}

function renderLog(){
  log.innerHTML = "";
  if (!state.turns.length){
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = `<h1>Think out loud. Get scored like it's the real round.</h1>
      <p>Learn consulting and PM frameworks one at a time, drill them, then run live mocks with rubric feedback.</p>`;
    if (sampleDenied) {
      const u = document.createElement("div"); u.className="unavailable";
      u.textContent = "The coach needs permission to use Claude. Reload the page and allow it when asked.";
      e.prepend(u);
    }
    const btn = document.createElement("button"); btn.className="primary"; btn.textContent="Start with a diagnostic";
    btn.onclick = () => send(CHIPS[0][1], "Start diagnostic");
    e.appendChild(btn); log.appendChild(e); return;
  }
  for (const t of state.turns) bubble(t.role, t.display || t.content);
  log.scrollTop = log.scrollHeight;
}

function renderChips(){
  const c = $("#chips"); c.innerHTML = "";
  for (const [label, prompt] of CHIPS){
    const b = document.createElement("button"); b.className="chip"; b.textContent=label;
    b.onclick = () => send(prompt, label); c.appendChild(b);
  }
}

function renderTrack(){
  document.querySelectorAll(".track button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.track === state.track)));
}

function renderLib(){
  const body = $("#libBody"); body.innerHTML = "";
  const total = LIB.reduce((n,g)=>n+g.items.length,0);
  $("#progress").textContent = `${state.learned.length} of ${total} learned`;
  for (const g of LIB){
    const sec = document.createElement("div"); sec.className="group";
    const h = document.createElement("h3");
    h.innerHTML = `<span class="dot" style="background:${g.color}"></span>`;
    h.appendChild(document.createTextNode(g.name)); sec.appendChild(h);
    for (const item of g.items){
      const done = state.learned.includes(item);
      const row = document.createElement("div"); row.className = "item" + (done ? " done" : "");
      const cb = document.createElement("input"); cb.type="checkbox"; cb.checked=done;
      cb.setAttribute("aria-label", "Mark " + item + " as learned");
      cb.onchange = () => {
        state.learned = cb.checked ? [...state.learned, item] : state.learned.filter(x => x !== item);
        renderLib(); save();
      };
      const t = document.createElement("button"); t.textContent = item;
      t.onclick = () => { closeLib(); send(`Teach me: ${item}. Start with step 1 only.`, `Teach me: ${item}`); };
      row.append(cb, t); sec.appendChild(row);
    }
    body.appendChild(sec);
  }
}

function openLib(){ renderLib(); $("#sheet").classList.add("open"); $("#sheet").setAttribute("aria-hidden","false"); $("#closeLib").focus(); }
function closeLib(){ $("#sheet").classList.remove("open"); $("#sheet").setAttribute("aria-hidden","true"); }

const ERR = {
  not_granted:"The coach needs permission to use Claude. Reload and allow it to continue.",
  rate_limited:"Too many requests at once. Wait a moment, then send again.",
  cancelled:"",
  auth:"Access code saved. Send your message again.",
  too_long:"This conversation is too long. Tap New to start a fresh one (your ticked frameworks stay).",
};

async function send(content, display){
  content = (content || "").trim();
  if (!content || busy) return;
  if (!sample){
    alert("The coach is still connecting. Try again in a few seconds."); return;
  }
  busy = true; sendBtn.textContent = "Stop"; box.value = ""; autosize();
  if (!state.turns.length) log.innerHTML = "";
  state.turns.push({role:"user", content, display: display || content});
  bubble("user", display || content);
  const b = bubble("assistant", ""); b.innerHTML = '<span class="thinking">Thinking...</span>';
  log.scrollTop = log.scrollHeight;

  const recent = state.turns.slice(-40).map(t => ({role:t.role, content:t.content}));
  while (recent.length && recent[0].role !== "user") recent.shift();
  const learnedNote = state.learned.length ? `\n\nFrameworks I've marked as learned: ${state.learned.join(", ")}.` : "";
  const input = [
    {role:"user", content: RULES + "\n\n" + TRACK_NOTE[state.track] + learnedNote},
    {role:"assistant", content:"Understood. I'll coach one step at a time."},
    ...recent
  ];

  ctl = new AbortController();
  try{
    const {text, truncated} = await sample(input, {
      cache:false, signal:ctl.signal,
      onText: ({text}) => { b.innerHTML = md(text); log.scrollTop = log.scrollHeight; }
    });
    b.innerHTML = md(text);
    state.turns.push({role:"assistant", content:text});
    if (truncated) addNote("That reply was cut short. Ask the coach to continue.");
    save();
  }catch(e){
    const kept = e && e.text;
    if (kept){ b.innerHTML = md(kept); state.turns.push({role:"assistant", content:kept}); }
    else { b.parentElement.remove(); state.turns.pop(); }
    if (e && e.code === "not_granted") sampleDenied = true;
    const msg = e && e.code in ERR ? ERR[e.code] : "The coach couldn't reply. Send your message again.";
    if (msg) addNote(msg);
    save();
  }finally{
    busy = false; ctl = null; sendBtn.textContent = "Send";
  }
}

function addNote(t){ const n = document.createElement("div"); n.className="note"; n.textContent=t; log.appendChild(n); log.scrollTop = log.scrollHeight; }

let saving = false, pending = false;
async function save(){
  const body = {turns: state.turns.slice(-80), learned: state.learned, track: state.track};
  try{ localStorage.setItem("case-coach", JSON.stringify(body)); }catch(e){}
  if (!docRef) return;
  if (saving){ pending = true; return; }
  saving = true;
  try{ await docRef.set(body); }catch(e){}
  saving = false;
  if (pending){ pending = false; save(); }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem("case-coach");
    if (raw){ const s = JSON.parse(raw); if (s && Array.isArray(s.turns)) state = {...state, ...s}; }
  }catch(e){}
}

function autosize(){ box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight,160) + "px"; }

sendBtn.onclick = () => { if (busy){ ctl && ctl.abort(); } else send(box.value); };
box.addEventListener("input", autosize);
box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover:hover)").matches){ e.preventDefault(); send(box.value); } });
document.querySelectorAll(".track button").forEach(b => b.onclick = () => { state.track = b.dataset.track; renderTrack(); save(); });
$("#libBtn").onclick = openLib; $("#closeLib").onclick = closeLib; $("#scrim").onclick = closeLib;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLib(); });

// Header menu: new session
const resetBtn = document.createElement("button");
resetBtn.className = "iconbtn"; resetBtn.textContent = "New";
resetBtn.title = "Start a new conversation (keeps your learned frameworks)";
resetBtn.onclick = () => { if (busy) return; if (confirm("Start a new conversation? Your learned frameworks stay ticked.")){ state.turns = []; save(); renderLog(); } };
document.querySelector("header").appendChild(resetBtn);

loadLocal(); renderTrack(); renderChips(); renderLog();

// Standalone mode: outside claude.ai, talk to the local server's /api/chat proxy.
function accessCode(){ try{ return localStorage.getItem("case-coach-code") || ""; }catch(e){ return ""; } }
function standaloneSample(){
  return async function(input, opts = {}){
    const res = await fetch("api/chat", {
      method:"POST", headers:{"Content-Type":"application/json", "x-access-code": accessCode()},
      body: JSON.stringify({messages: input}), signal: opts.signal
    }).catch(e => { throw {code: e.name === "AbortError" ? "cancelled" : "network", message: String(e)}; });
    if (res.status === 429) throw {code:"rate_limited", message:"Rate limited"};
    if (res.status === 401){
      const c = prompt("Enter the access code for this coach:");
      if (c){ try{ localStorage.setItem("case-coach-code", c.trim()); }catch(e){} }
      throw {code:"auth", message:"Access code required"};
    }
    if (res.status === 413) throw {code:"too_long", message:"Too long"};
    if (!res.ok || !res.body) throw {code:"server", message:"Server error " + res.status};
    const reader = res.body.getReader(), dec = new TextDecoder();
    let text = "";
    try{
      for(;;){
        const {done, value} = await reader.read();
        if (done) break;
        const delta = dec.decode(value, {stream:true});
        text += delta;
        if (opts.onText) opts.onText({text, delta});
      }
    }catch(e){
      throw {code: e.name === "AbortError" ? "cancelled" : "network", message:String(e), text};
    }
    return {text, truncated:false};
  };
}

(async () => {
  if (!window.claude){ sample = standaloneSample(); return; }
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  try{
    db = await claude.use("db");
    const user = await claude.use("user");
    const uid = user ? await user.id() : null;
    if (db && uid){
      docRef = db.doc("data/users/" + uid + "/coach");
      const snap = await docRef.get();
      if (snap.exists){
        const s = snap.data();
        if (s && Array.isArray(s.turns) && !busy){
          state = {turns: s.turns, learned: s.learned || [], track: s.track || "both"};
          renderTrack(); renderLog();
        }
      }
    }
  }catch(e){ docRef = null; }
})();
</script>
</body>
</html>
